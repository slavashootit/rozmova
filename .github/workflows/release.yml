name: Release

# Builds the DMG and publishes it as a GitHub release. Runs on a pushed tag like v1.0.0,
# or by hand ("Run workflow"), taking the version from Info.plist and creating the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app and DMG
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Info.plist)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ./scripts/package.sh "$VERSION"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Rozmova-dmg
          path: build/*.dmg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" build/*.dmg \
            --target "$GITHUB_SHA" \
            --title "Rozmova $VERSION" \
            --notes-file .github/release-notes.md

name: Release

# Builds the DMG and publishes it as a GitHub release. Runs on a pushed tag like v1.0.0,
# or by hand ("Run workflow"), taking the version from Info.plist and creating the tag.
# Running it again for a version that is already released rebuilds that release in place.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app and DMG
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Info.plist)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ./scripts/package.sh "$VERSION"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Rozmova-dmg
          path: build/*.dmg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            # Same version built again: move the tag to this commit and replace the DMG.
            git tag -f "v$VERSION" "$GITHUB_SHA"
            git push -f origin "refs/tags/v$VERSION"
            gh release upload "v$VERSION" build/*.dmg --clobber
          else
            gh release create "v$VERSION" build/*.dmg \
              --target "$GITHUB_SHA" \
              --title "Rozmova $VERSION" \
              --notes-file .github/release-notes.md
          fi
